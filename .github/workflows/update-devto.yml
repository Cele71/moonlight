# ⚠ Generated by product/field-note/build.py in the Moonlight working tree.
# Edit it there, not here: this file is overwritten on every cycle.
#
# Writes devto/*.json onto the dev.to posts they name.
# ⚠ Inert until the repository secret DEVTO_TOKEN exists.
# ⚠⚠ Two permissions, not one. DEVTO_TOKEN lets it REPAIR posts that are
# already up. Publishing a NEW article needs the repository VARIABLE
# DEVTO_MAY_PUBLISH set to `yes` as well - a separate, deliberate, one-time
# decision by a person, because putting something in front of readers that
# was not there before is a different act from correcting something that was.
# Without the variable the repairs run and nothing is created.
name: Update the dev.to articles

on:
  # ⚠⚠ B109. No paths filter, and a schedule. The event this workflow waits
  # for is not a change to devto - it is the secret appearing. Adding a secret
  # is not a push and touches no path, so a `paths:` filter guarantees that
  # the run does NOT happen at the one moment it became able to work. The
  # schedule is what makes the arrival of a key self-healing; the push
  # trigger is what makes a fix land immediately.
  push:
    branches:
      - main
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

# ⚠⚠ B131. Same group name as the other two workflows. All three end by
# committing to main and all three swallow a lost push race, which is correct
# for a diagnostic and wrong for anything that must not be repeated. A shared
# queue means there is no race to swallow. ⚠ cancel-in-progress is false: a run
# cancelled after it has written to a venue loses the record of having done so.
concurrency:
  group: moonlight-writes-main
  cancel-in-progress: false
permissions:
  # ⚠ B109. write, not read: the last step commits devto/last-run.txt back so
  # that what this run did is readable without a GitHub token. Nothing else in
  # the job writes to the repository.
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # ⚠ Read here only to test whether it is empty. Never echoed.
      HAS_TOKEN_PROBE: ${{ secrets.DEVTO_TOKEN }}
    steps:
      - id: gate
        name: Is there a token yet
        run: |
          if [ -z "$HAS_TOKEN_PROBE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Nothing updated" >> "$GITHUB_STEP_SUMMARY"
            echo "No DEVTO_TOKEN secret on this repository, so this run did NOT change any dev.to post." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it under Settings -> Secrets and variables -> Actions. Nothing else is needed: the agent pushes to main at least once per cycle while any gate is shut, and every push runs this job, so it applies on its own within about an hour (B110 - the hourly schedule here has never once fired)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - name: Put the articles on dev.to
        if: steps.gate.outputs.ready == 'true'
        env:
          DEVTO_TOKEN: ${{ secrets.DEVTO_TOKEN }}
          # ⚠ A variable, not a secret: this is a decision, not a credential,
          # and a decision that cannot be read back is not auditable. Empty
          # unless somebody set it, and anything other than `yes` means no.
          DEVTO_MAY_PUBLISH: ${{ vars.DEVTO_MAY_PUBLISH }}
        run: python3 devto/update_articles.py
      - name: Leave the outcome somewhere a keyless reader can find it
        # ⚠⚠ always(): the case worth reading is the failing one, and a step
        # that only runs on success reports only the outcome nobody needs.
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          [ -f devto/last-run.txt ] || exit 0
          git config user.name 'moonlight actions'
          git config user.email 'actions@users.noreply.github.com'
          git add devto/last-run.txt
          # ⚠⚠ The lock on creating the same article twice. It is written by
          # the run that published, and it is worth nothing unless it comes
          # back to the repository - a later run reads it from a fresh
          # checkout and would otherwise see an empty file.
          # ⚠ `if`, not `&&`: the step runs under `bash -e`, and a one-line
          # AND list whose test fails is exactly the shape that reads as
          # harmless and is argued about instead of being written plainly.
          if [ -f devto/created.txt ]; then git add devto/created.txt; fi
          git diff --cached --quiet && exit 0
          git commit -q -m 'devto: what the last run actually did'
          # ⚠ Never fail the job over this. A push race here would turn a
          # successful update into a red cross and hide the real result.
          # ⚠ A push made with GITHUB_TOKEN does not start another workflow
          # run, so this cannot loop.
          git pull -q --rebase origin main || { git rebase --abort || true; exit 0; }
          git push -q origin HEAD:main || echo 'push lost a race - the file is in the run log above'
