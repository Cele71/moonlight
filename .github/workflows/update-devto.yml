# ⚠ Generated by product/field-note/build.py in the Moonlight working tree.
# Edit it there, not here: this file is overwritten on every cycle.
#
# Writes devto/*.json onto the dev.to posts they name.
# ⚠ Inert until the repository secret DEVTO_TOKEN exists.
# ⚠ It updates and never creates - see devto/update_articles.py, which is what
# runs. There is no POST in it.
name: Update the dev.to articles

on:
  # ⚠⚠ B109. No paths filter, and a schedule. The event this workflow waits
  # for is not a change to devto - it is the secret appearing. Adding a secret
  # is not a push and touches no path, so a `paths:` filter guarantees that
  # the run does NOT happen at the one moment it became able to work. The
  # schedule is what makes the arrival of a key self-healing; the push
  # trigger is what makes a fix land immediately.
  push:
    branches:
      - main
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  # ⚠ B109. write, not read: the last step commits devto/last-run.txt back so
  # that what this run did is readable without a GitHub token. Nothing else in
  # the job writes to the repository.
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # ⚠ Read here only to test whether it is empty. Never echoed.
      HAS_TOKEN_PROBE: ${{ secrets.DEVTO_TOKEN }}
    steps:
      - id: gate
        name: Is there a token yet
        run: |
          if [ -z "$HAS_TOKEN_PROBE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Nothing updated" >> "$GITHUB_STEP_SUMMARY"
            echo "No DEVTO_TOKEN secret on this repository, so this run did NOT change any dev.to post." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it under Settings -> Secrets and variables -> Actions. Nothing else is needed: this job also runs hourly on a schedule, so it applies on its own (B109)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - name: Put the articles on dev.to
        if: steps.gate.outputs.ready == 'true'
        env:
          DEVTO_TOKEN: ${{ secrets.DEVTO_TOKEN }}
        run: python3 devto/update_articles.py
      - name: Leave the outcome somewhere a keyless reader can find it
        # ⚠⚠ always(): the case worth reading is the failing one, and a step
        # that only runs on success reports only the outcome nobody needs.
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          [ -f devto/last-run.txt ] || exit 0
          git config user.name 'moonlight actions'
          git config user.email 'actions@users.noreply.github.com'
          git add devto/last-run.txt
          git diff --cached --quiet && exit 0
          git commit -q -m 'devto: what the last run actually did'
          # ⚠ Never fail the job over this. A push race here would turn a
          # successful update into a red cross and hide the real result.
          # ⚠ A push made with GITHUB_TOKEN does not start another workflow
          # run, so this cannot loop.
          git pull -q --rebase origin main || { git rebase --abort || true; exit 0; }
          git push -q origin HEAD:main || echo 'push lost a race - the file is in the run log above'
