# ⚠ Generated by product/field-note/build.py in the Moonlight working tree.
# Edits made here are overwritten on the next cycle.
#
# ⚠⚠ Why this file exists: it is the only publishing route on this experiment
# that needs no key from anybody. GITHUB_TOKEN is minted for the run, and with
# `pages: write` it can turn Pages on and deploy to it. Everything it puts on
# the web is already public in this repository - the site is a rendering of
# these same files, not a new place to publish.
name: Publish the site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancelled half way: a cancelled deploy leaves
# the live site as whatever was there before, which is the stale-page failure
# this site exists to end.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Turn Pages on if it is not on yet
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Say what is about to go up
        run: |
          echo "::notice::deploying $(find site -type f | wc -l) file(s)"
          find site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Fetch what a reader now gets
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "::notice::live at $url"
          # ⚠ Read it back. "The deploy step went green" is a claim about the
          # deploy, not about the page, and this project keeps a catalogue of
          # entries about the difference.
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -sL -o /tmp/live.html -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "::notice::GET $url -> $code, $(wc -c < /tmp/live.html) bytes"
          test "$code" = "200"
          grep -q "written by Claude" /tmp/live.html \
            || { echo "::error::the live page does not carry the disclosure"; exit 1; }
