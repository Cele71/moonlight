# ⚠ Generated by product/field-note/build.py in the Moonlight working tree.
# Edit it there, not here: this file is overwritten on every cycle.
#
# Publishes the articles under public/ to Qiita with Qiita's own CLI.
# ⚠ Inert until the repository secret QIITA_TOKEN exists. The gate below is
# why the run is green rather than red while it is inert - a red cross on
# every push is a notification on somebody's phone, and this is not news. It
# says so out loud in the job summary instead, because a green run that did
# nothing must not look like a green run that published.
name: Publish articles to Qiita

on:
  # ⚠⚠ B109. No paths filter, and a schedule. The event this workflow waits
  # for is not a change to public - it is the secret appearing. Adding a secret
  # is not a push and touches no path, so a `paths:` filter guarantees that
  # the run does NOT happen at the one moment it became able to work. The
  # schedule is what makes the arrival of a key self-healing; the push
  # trigger is what makes a fix land immediately.
  push:
    branches:
      - main
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # ⚠ Read here only to test whether it is empty. Never echoed.
      HAS_TOKEN_PROBE: ${{ secrets.QIITA_TOKEN }}
    steps:
      - id: gate
        name: Is there a token yet
        run: |
          if [ -z "$HAS_TOKEN_PROBE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Nothing published" >> "$GITHUB_STEP_SUMMARY"
            echo "No QIITA_TOKEN secret on this repository, so this run did NOT publish anything." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it under Settings -> Secrets and variables -> Actions. Nothing else is needed: the agent pushes to main at least once per cycle while any gate is shut, and every push runs this job, so it publishes on its own within about an hour (B110 - the hourly schedule here has never once fired)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - id: publish
        uses: increments/qiita-cli/actions/publish@v1
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
      # ⚠⚠ B124/B109. What this run actually did, written where a reader with
      # no GitHub token can find it. The vendor action's own diagnostics go to
      # the job log, and the job log needs admin rights on this repository -
      # measured, not assumed: the logs endpoint answers 403 to an anonymous
      # request. So the agent that has to fix this can observe exactly one bit
      # from outside, the word "failure", which is what B109 was.
      # ⚠ This run reported failure twice while the two live articles were in
      # fact updated (verified against Qiita's API). A red run that did the
      # work is as misleading as a green run that did nothing - the comment at
      # the top of this file argues one half of that and this step is the
      # other half.
      - name: Leave the outcome somewhere a keyless reader can find it
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          {
            echo "# What the last run of the Qiita publish did."
            echo "# Written by the run itself and committed back, because the"
            echo "# job log needs admin rights on this repository to read."
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)  run ${{ github.run_id }}  action=${{ steps.publish.outcome }}"
            echo
            echo "## every article and the id the venue gave it"
            echo "## (id: null means Qiita has never seen this file - the next"
            echo "##  run will CREATE it, so a null here after a run that"
            echo "##  claims to have published is the duplicate risk of B95)"
            for f in public/*.md; do
              echo "$f  id=$(sed -n 's/^id: *//p' "$f" | head -1)  private=$(sed -n 's/^private: *//p' "$f" | head -1)"
            done
            echo
            echo "## what the working tree looks like after the action ran"
            git status --porcelain
          } > public/last-run.txt
          git config user.name 'moonlight actions'
          git config user.email 'actions@users.noreply.github.com'
          git add public/
          git diff --cached --quiet && exit 0
          git commit -q -m 'qiita: what the last run actually did'
          # ⚠ Never fail the job over this: a push race here would turn a
          # successful run into a red cross and hide the real result. ⚠ A push
          # made with GITHUB_TOKEN starts no further run, so it cannot loop.
          # ⚠⚠ HEAD:main, not a bare push - the checkout is a detached HEAD.
          git pull -q --rebase origin main || { git rebase --abort || true; exit 0; }
          git push -q origin HEAD:main || echo 'push lost a race - the next run rewrites this file'
      - name: Fail if the publish step failed
        # ⚠ After the write-back, never before: a failing step that aborts the
        # job takes the diagnostics with it, which is the whole fault above.
        if: always() && steps.gate.outputs.ready == 'true' && steps.publish.outcome == 'failure'
        run: |
          echo "The Qiita publish step failed. See public/last-run.txt on main."
          exit 1
