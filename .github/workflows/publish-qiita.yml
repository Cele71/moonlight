# ⚠ Generated by product/field-note/build.py in the Moonlight working tree.
# Edit it there, not here: this file is overwritten on every cycle.
#
# Publishes the articles under public/ to Qiita with Qiita's own CLI.
# ⚠ Inert until the repository secret QIITA_TOKEN exists. The gate below is
# why the run is green rather than red while it is inert - a red cross on
# every push is a notification on somebody's phone, and this is not news. It
# says so out loud in the job summary instead, because a green run that did
# nothing must not look like a green run that published.
name: Publish articles to Qiita

on:
  # ⚠⚠ B109. No paths filter, and a schedule. The event this workflow waits
  # for is not a change to public - it is the secret appearing. Adding a secret
  # is not a push and touches no path, so a `paths:` filter guarantees that
  # the run does NOT happen at the one moment it became able to work. The
  # schedule is what makes the arrival of a key self-healing; the push
  # trigger is what makes a fix land immediately.
  push:
    branches:
      - main
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# ⚠⚠ B131. Three identical articles exist at this venue, created 11:44:47,
# 11:57:53 and 12:03:43 on 2026-09-04. The file was pushed carrying `id: null`;
# the CLI CREATES when the id is empty and writes the new id back into the
# file, and that write-back is a commit that has to win a push race. Three
# pushes inside twenty minutes started three runs that overlapped, every one of
# them read `id: null`, and every one of them created. ⚠ Only one of the three
# ids survived into the repository, so my own files - which carry one id each -
# cannot see the other two at all. Without a queue this repeats every time two
# pushes land close together, and once QIITA_MAY_PUBLISH is on it repeats in
# the feed rather than out of sight.
# ⚠ cancel-in-progress is false on purpose: cancelling a run that has already
# POSTed an article would lose the id write-back, which is the fault itself.
# ⚠⚠ One group NAME across all three workflows, not one per workflow. The
# second half of B131 is that these three all end by committing to main and
# every one of them swallows a lost push race - `|| echo 'push lost a race'` -
# so that a race cannot redden a run that did its work. Measured, not assumed:
# on 2026-09-04 the Qiita write-back landed at 09:51Z and the dev.to one, from
# the same push, never arrived. Swallowing the race is right for a diagnostic
# and wrong for the id, and the two travel in the same commit. A shared group
# means only one of the three can be writing to main at a time, so there is no
# race to swallow.
concurrency:
  group: moonlight-writes-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # ⚠ Read here only to test whether it is empty. Never echoed.
      HAS_TOKEN_PROBE: ${{ secrets.QIITA_TOKEN }}
      # ⚠ A name, not a value: printed into the report so that a reader with
      # no GitHub account can see which switch is being waited on.
      QIITA_VAR_NAME: 'QIITA_MAY_PUBLISH'
    steps:
      - id: gate
        name: Is there a token yet
        run: |
          if [ -z "$HAS_TOKEN_PROBE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Nothing published" >> "$GITHUB_STEP_SUMMARY"
            echo "No QIITA_TOKEN secret on this repository, so this run did NOT publish anything." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it under Settings -> Secrets and variables -> Actions. Nothing else is needed: the agent pushes to main at least once per cycle while any gate is shut, and every push runs this job, so it publishes on its own within about an hour (B110 - the hourly schedule here has never once fired)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      # ⚠⚠ B129. Two different permissions, and the token is only the first.
      # QIITA_TOKEN lets this job correct articles that are already public.
      # Putting a NEW one in front of readers is a separate, deliberate,
      # one-time decision, and it lives in a repository VARIABLE - a value
      # anyone can read - because a permission nobody can read is not a
      # permission (B114). Until it says yes, a new article lands 限定共有:
      # reachable by URL, absent from every feed.
      # ⚠ What this step is for, and why the flip is not left to a human tap:
      # Qiita orders its item list by created_at, so every hour an article
      # waits unlisted is an hour it sinks. Flipping it here means the article
      # becomes public within a minute of the permission arriving, not within
      # a day of somebody opening the site on a phone.
      # ⚠ One per run, oldest first: a wrong batch cannot empty itself onto
      # the front page. The disclosure is checked in the body before the flip,
      # not after - the same order as the dev.to publisher.
      - id: maypub
        name: May a new article be made public
        if: steps.gate.outputs.ready == 'true'
        env:
          QIITA_MAY_PUBLISH: ${{ vars.QIITA_MAY_PUBLISH }}
        run: |
          python3 - <<'PY'
          import glob, io, os
          # ⚠ chr(10) rather than a backslash escape: this script is a string
          # inside build.py, written into a YAML block scalar, and read by a
          # third interpreter. A backslash crossing three layers is a bug
          # waiting for the layer that eats it - and it did, on the first try.
          NL = chr(10)
          MARK = 'この記事は Claude（Anthropic）が書きました'
          may = os.environ.get('QIITA_MAY_PUBLISH', '').strip().lower() == 'yes'
          notes, made = [], 0
          for path in sorted(glob.glob('public/*.md')):
              lines = io.open(path, encoding='utf-8').read().split(NL)
              end = None
              for i, ln in enumerate(lines):
                  if i and ln.rstrip() == '---':
                      end = i
                      break
              if end is None:
                  continue
              front, body = lines[1:end], NL.join(lines[end + 1:])
              hit = [i + 1 for i, ln in enumerate(front)
                     if ln.strip() == 'private: true']
              if not hit:
                  continue
              stem = os.path.basename(path)[:-3]
              if not may:
                  notes.append('### Qiita: ' + stem + ' left 限定共有' + NL +
                               'The repository variable QIITA_MAY_PUBLISH is not set to '
                               'yes, so this run made nothing public. The token '
                               'allows repairs to articles that are already up; putting a '
                               'NEW article in front of readers is a separate permission '
                               'and has to be given separately.')
                  continue
              if MARK not in body:
                  notes.append('### Qiita: ' + stem + ' NOT made public' + NL +
                               'The AI disclosure sentence is not in the body, so nothing '
                               'was flipped. An undisclosed article is the one failure '
                               'that is worse than not publishing at all.')
                  continue
              if made:
                  notes.append('### Qiita: ' + stem + ' would be made public' + NL +
                               'One article has already been made public this run. One '
                               'per run, so a bad batch cannot empty itself onto the '
                               'front page.')
                  continue
              lines[hit[0]] = 'private: false'
              io.open(path, 'w', encoding='utf-8').write(NL.join(lines))
              made += 1
              notes.append('### Qiita: ' + stem + ' made public' + NL +
                           'The permission said yes, the disclosure is in the body, and '
                           'this run flipped private to false. The CLI step below is what '
                           'tells Qiita, and check_live.py goes and reads the article back '
                           'from Qiita on the next cycle.')
          if not notes:
              notes.append('### Qiita: nothing was unlisted' + NL +
                           'Every article under public/ is already public, so this '
                           'permission had nothing to act on.')
          tmp = os.environ.get('RUNNER_TEMP') or '.'
          io.open(os.path.join(tmp, 'qiita-gate.txt'), 'w',
                  encoding='utf-8').write(NL.join(notes))
          for n in notes:
              print(n)
          PY
      # ⚠⚠ B130. The one number never taken from this venue: how many
      # people arrived. LGTM and stock are what a reader does AFTER arriving,
      # and for eleven days they were the only figures on the board, which
      # made a conversion number stand in for a traffic number. They point at
      # opposite repairs - views with no sale is an offer problem, no views is
      # a reach problem - so reading one as the other guarantees fixing the
      # wrong end. page_views_count is only returned to the author of an item,
      # which is why it has to be asked for here, inside the job that holds
      # the key, and written back where a keyless reader can find it.
      # ⚠ continue-on-error: a missing number must never stop a publish.
      - id: audience
        name: How many people the venue says the articles reached
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          python3 - <<'PY'
          import io, json, os, urllib.request
          NL = chr(10)
          lines = ['### what Qiita says reached a reader',
                   'page_views_count is how many arrived. An LGTM is what one '
                   'of them did afterwards. Only the first answers whether '
                   'anybody came.']
          req = urllib.request.Request(
              'https://qiita.com/api/v2/authenticated_user/items?per_page=100')
          # ⚠ The key travels in a header and is never printed. B109: name
          # the program, because the default urllib User-Agent is refused by
          # more than one venue's edge.
          req.add_header('Authorization',
                         'Bearer ' + os.environ.get('QIITA_TOKEN', ''))
          req.add_header('User-Agent', 'Moonlight/1.0 '
                         '(+https://github.com/Cele71/moonlight)')
          items = []
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  items = json.loads(resp.read().decode('utf-8', 'replace'))
          except Exception as exc:
              lines.append('could not ask: ' + exc.__class__.__name__ +
                           ' - no number here means NOT MEASURED, not zero')
          total, counted, missing = 0, 0, 0
          for it in items:
              got = it.get('page_views_count')
              if got is None:
                  missing += 1
                  shown = '?'
              else:
                  total += got
                  counted += 1
                  shown = str(got)
              lines.append('  %s  %s views  %s LGTM  %s stock  private=%s  %s'
                           % (it.get('id'), shown, it.get('likes_count'),
                              it.get('stocks_count'), it.get('private'),
                              (it.get('title') or '')[:36]))
          if items:
              lines.append('  total %d view(s) across %d article(s)'
                           % (total, counted))
          # ⚠⚠ B131/B95. Taking the audience meant asking the venue for its
          # whole list for the first time, and the list held three copies of
          # one article. Nothing was looking: my own ledger holds one id per
          # file, so a second copy the venue made is invisible to every check
          # that starts from my files. This starts from the VENUE's list, which
          # is the only place a duplicate can be seen at all.
          bytitle = {}
          for it in items:
              bytitle.setdefault((it.get('title') or '').strip(), []).append(
                  str(it.get('id')))
          dupes = sorted((t, ids) for t, ids in bytitle.items() if len(ids) > 1)
          if dupes:
              lines.append('DUPLICATE: %d title(s) exist more than once on '
                           'this account. ⚠ B95 - the venue made a second copy '
                           'and my files, which hold one id each, cannot see '
                           'it.' % len(dupes))
              for title, ids in dupes:
                  lines.append('  %s -> %s' % (title[:36], ' '.join(ids)))
          if missing:
              lines.append('  %d article(s) came back with no '
                           'page_views_count. Absent is not zero.' % missing)
          tmp = os.environ.get('RUNNER_TEMP') or '.'
          with io.open(os.path.join(tmp, 'qiita-audience.txt'), 'w',
                       encoding='utf-8') as fh:
              fh.write(NL.join(lines))
          print(NL.join(lines))
          PY
      - id: publish
        uses: increments/qiita-cli/actions/publish@v1
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
      # ⚠⚠ B124/B109. What this run actually did, written where a reader with
      # no GitHub token can find it. The vendor action's own diagnostics go to
      # the job log, and the job log needs admin rights on this repository -
      # measured, not assumed: the logs endpoint answers 403 to an anonymous
      # request. So the agent that has to fix this can observe exactly one bit
      # from outside, the word "failure", which is what B109 was.
      # ⚠ This run reported failure twice while the two live articles were in
      # fact updated (verified against Qiita's API). A red run that did the
      # work is as misleading as a green run that did nothing - the comment at
      # the top of this file argues one half of that and this step is the
      # other half.
      - name: Leave the outcome somewhere a keyless reader can find it
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          {
            echo "# What the last run of the Qiita publish did."
            echo "# Written by the run itself and committed back, because the"
            echo "# job log needs admin rights on this repository to read."
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)  run ${{ github.run_id }}  action=${{ steps.publish.outcome }}"
            echo
            echo "## what the publish permission ($QIITA_VAR_NAME) did this run"
            cat "${RUNNER_TEMP}/qiita-gate.txt" 2>/dev/null || echo "(the gate step did not run)"
            echo
            echo "## how many people the venue says arrived"
            cat "${RUNNER_TEMP}/qiita-audience.txt" 2>/dev/null || echo "(the audience step did not run)"
            echo
            echo "## every article and the id the venue gave it"
            echo "## (id: null means Qiita has never seen this file - the next"
            echo "##  run will CREATE it, so a null here after a run that"
            echo "##  claims to have published is the duplicate risk of B95)"
            for f in public/*.md; do
              echo "$f  id=$(sed -n 's/^id: *//p' "$f" | head -1)  private=$(sed -n 's/^private: *//p' "$f" | head -1)"
            done
            echo
            echo "## what the working tree looks like after the action ran"
            git status --porcelain
          } > public/last-run.txt
          git config user.name 'moonlight actions'
          git config user.email 'actions@users.noreply.github.com'
          # ⚠ Whatever is named here is committed to a PUBLIC repository, so
          # it is a list of files and never a folder. `git add public/` swept
          # in the Qiita CLI's own cache directory on the first run of this
          # step and published it.
          git add public/*.md public/last-run.txt
          git diff --cached --quiet && exit 0
          git commit -q -m 'qiita: what the last run actually did'
          # ⚠ Never fail the job over this: a push race here would turn a
          # successful run into a red cross and hide the real result. ⚠ A push
          # made with GITHUB_TOKEN starts no further run, so it cannot loop.
          # ⚠⚠ HEAD:main, not a bare push - the checkout is a detached HEAD.
          git pull -q --rebase origin main || { git rebase --abort || true; exit 0; }
          git push -q origin HEAD:main || echo 'push lost a race - the next run rewrites this file'
      - name: Fail if the publish step failed
        # ⚠ After the write-back, never before: a failing step that aborts the
        # job takes the diagnostics with it, which is the whole fault above.
        if: always() && steps.gate.outputs.ready == 'true' && steps.publish.outcome == 'failure'
        run: |
          echo "The Qiita publish step failed. See public/last-run.txt on main."
          exit 1
